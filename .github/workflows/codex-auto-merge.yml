name: Codex market auto-merge

on:
  workflow_run:
    workflows: [Codex subscription review, Validate and publish market]
    types: [completed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Optional PR number; empty checks all open main PRs
        type: string
        default: ''
      dry_run:
        description: Report eligibility without merging
        type: boolean
        default: false
      publish_only:
        description: Retry Pages dispatch for a PR already merged by this pilot
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codex-market-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'fuxi-ailabs/dsh-plugin-market' && github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PILOT_ENABLED: ${{ vars.CODEX_AUTO_MERGE_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          PUBLISH_ONLY: ${{ inputs.publish_only || false }}
        with:
          script: |
            const {run} = require('./.github/scripts/codex-auto-merge.cjs');
            await run({github, context, core, enabled: process.env.PILOT_ENABLED === 'true', dryRun: process.env.DRY_RUN === 'true', publishOnly: process.env.PUBLISH_ONLY === 'true'});
