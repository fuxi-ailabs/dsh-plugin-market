name: Verify Codex review request bridge

on:
  push:
    branches: [codex/codex-review-trigger-probe-20261030]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    if: github.repository == 'fuxi-ailabs/dsh-plugin-market'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const {data: pulls} = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${branch}`});
            const pr = pulls.find(item => item.head.sha === context.sha);
            if (!pr) {
              core.notice('No open PR for this probe head; no review requested.');
              return;
            }
            const marker = `<!-- codex-review-bridge-probe head=${pr.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number, per_page: 100});
            if (comments.some(comment => comment.body?.includes(marker))) {
              core.notice('This head already has a probe request.');
              return;
            }
            const {data: comment} = await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `@codex review\n\n自动审查触发验证：本请求由提交后的 GitHub Actions 自动发起，当前 head 为 ${pr.head.sha}。请按 AGENTS.md 审查，无需修改代码。\n\n${marker}`,
            });
            core.notice(`Requested review: ${comment.html_url}`);
            await core.summary.addHeading('Codex trigger probe').addLink('Review request', comment.html_url).addRaw(`\n\nHead: ${pr.head.sha}\n`).write();
