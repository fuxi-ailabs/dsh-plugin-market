name: Review component pages

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: component-page-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.PLUGIN_PAGE_AI_REVIEW_ENABLED == 'true' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      revision: ${{ steps.input.outputs.revision }}
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out trusted rules and helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Collect PR metadata without running PR code
        id: input
        uses: actions/github-script@v7
        with:
          script: |
            const { prepareReview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/plugin-page-review.mjs`);
            await prepareReview({ github, context, core });
      - name: Require configured API access
        if: steps.input.outputs.relevant == 'true'
        env:
          KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$KEY_CONFIGURED" != 'true' ]; then
            echo '::error::Configure repository secret OPENAI_API_KEY before enabling component page reviews.'
            exit 1
          fi
      - name: Check out candidate files as review data
        if: steps.input.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.input.outputs.head_sha }}
          path: .review-input/candidate
          persist-credentials: false
      - name: Review without changing candidate files
        if: steps.input.outputs.relevant == 'true'
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/plugin-page-review.md
          permission-profile: ':read-only'
          safety-strategy: drop-sudo

  publish:
    needs: review
    if: needs.review.outputs.report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Update this PR's review comment if still current
        uses: actions/github-script@v7
        env:
          REVIEW_REVISION: ${{ needs.review.outputs.revision }}
          REVIEW_REPORT: ${{ needs.review.outputs.report }}
        with:
          script: |
            const { publishReview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/plugin-page-review.mjs`);
            await publishReview({ github, context, core, revision: process.env.REVIEW_REVISION, report: process.env.REVIEW_REPORT });
